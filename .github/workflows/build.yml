name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and self-test
        shell: powershell
        run: .\build.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: PassVault-win-x64
          path: release/*.zip
          if-no-files-found: error